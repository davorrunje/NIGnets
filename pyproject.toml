[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[metadata]
license_file = "LICENSE"
description-file = "README.md"

[project]
name = "NIGnets"
description = "Neural Injective Geometry networks (NIGnets) for non-self-intersecting geometry."
readme = "README.md"
authors = [
    {name = "Atharva Aalok", email = "atharvaaalok@gmail.com"}
]

keywords = ['NIGnets', 'geometry', 'neural networks', 'machine learning', 'deep learning',
            'optimization', 'shape optimization', 'geometric deep learning', 'shape matching',
            'neural injective geometry', 'geosimilarity', 'pytorch', 'autograd', 'curves',
            'surfaces', 'curve fitting', 'surface fitting']

requires-python = ">=3.9,<3.14"

dynamic = ["version"]

classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Information Technology",
]

dependencies = [
    'matplotlib==3.10.0',
    'numpy==2.2.3',
    'setuptools==57.4.0',
    'svg.path==6.3',
    'torch==2.5.1',
]

[project.optional-dependencies]

## dev dependencies

# test dependencies
test = [
    "ipykernel==6.29.5",
    "pytest-cov==6.0.0",
    "pytest-asyncio==0.25.3",
    "pytest==8.3.5",
]

docs = [
]

types = [
    "mypy==1.15.0",
]

lint = [
    "ruff==0.9.9",
    "codespell==2.4.1",
]

dev = [
    "toml==0.10.2",
    "pre-commit==4.1.0",
    "detect-secrets==1.5.0",
    "uv==0.6.4",
]


[project.urls]
Homepage = "https://atharvaaalok.github.io/NIGnets/"
Documentation = "https://atharvaaalok.github.io/NIGnets/"
Tracker = "https://github.com/atharvaaalok/NIGnets/issues"
Source = "https://github.com/atharvaaalok/NIGnets"

[tool.hatch.version]
path = "NIGnets/version.py"

[tool.hatch.build]
skip-excluded-dirs = true
exclude = ["/test", "/docs"]

[tool.hatch.build.targets.wheel]
packages = ["NIGnets"]
only-include = ["NIGnets"]

[tool.hatch.build.targets.sdist]
exclude = ["test", "notebook"]

[tool.hatch.build.targets.wheel.sources]
"NIGnets" = "NIGnets"

[tool.pytest.ini_options]
addopts = '--cov=NIGnets --cov-append --cov-branch --cov-report=xml -m "not conda"'
testpaths = [
    "test",
]

# markers = []


[tool.ruff]
fix = true
line-length = 100 # 88
target-version = 'py39'
# Exclude a variety of commonly ignored directories.
exclude = [
    ".eggs",
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    "__pypackages__",
    "_build",
    "build",
    "dist",
    "docs",
]

preview = true

[tool.ruff.lint]
# Enable Pyflakes `E` and `F` codes by default.
select = [
    "E",     # pycodestyle errors     https://docs.astral.sh/ruff/rules/#error-e
    "W",     # pycodestyle warnings   https://docs.astral.sh/ruff/rules/#warning-w
    "C90",   # mccabe                 https://docs.astral.sh/ruff/rules/#mccabe-c90
    "N",     # pep8-naming            https://docs.astral.sh/ruff/rules/#pep8-naming-n
#    "D",     # pydocstyle             https://docs.astral.sh/ruff/rules/#pydocstyle-d
    "I",     # isort                  https://docs.astral.sh/ruff/rules/#isort-i
    "F",     # pyflakes               https://docs.astral.sh/ruff/rules/#pyflakes-f
    "ASYNC", # flake8-async           https://docs.astral.sh/ruff/rules/#flake8-async-async
#    "C4",    # flake8-comprehensions  https://docs.astral.sh/ruff/rules/#flake8-comprehensions-c4
#    "B",     # flake8-bugbear         https://docs.astral.sh/ruff/rules/#flake8-bugbear-b
    "Q",     # flake8-quotes          https://docs.astral.sh/ruff/rules/#flake8-quotes-q
#    "T20",   # flake8-print           https://docs.astral.sh/ruff/rules/#flake8-print-t20
    "SIM",   # flake8-simplify        https://docs.astral.sh/ruff/rules/#flake8-simplify-sim
#    "PT",    # flake8-pytest-style    https://docs.astral.sh/ruff/rules/#flake8-pytest-style-pt
#    "PTH",   # flake8-use-pathlib     https://docs.astral.sh/ruff/rules/#flake8-use-pathlib-pth
#    "TCH",   # flake8-type-checking   https://docs.astral.sh/ruff/rules/#flake8-type-checking-tch
#    "RUF",   # Ruff-specific rules    https://docs.astral.sh/ruff/rules/#ruff-specific-rules-ruf
#    "PERF",  # Perflint               https://docs.astral.sh/ruff/rules/#perflint-perf
    "RUF022", # Sort __all__           https://docs.astral.sh/ruff/rules/unsorted-dunder-all/
#    "UP",     # pyupgrade              https://docs.astral.sh/ruff/rules/#pydocstyle-d
]

extend-select = ["D417"]

#ignore = ["E501", "F403", "C901",
#    "E402",
#    "E721",
#    "ASYNC109",
#    "E501",  # line too long, handled by formatter later
#    "D100", "D101", "D102", "D103", "D104",
#    "C901",  # too complex
#]

[tool.ruff.lint.mccabe]
# Unlike Flake8, default to a complexity level of 10.
max-complexity = 10

[tool.ruff.lint.isort]
case-sensitive = true

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint.pydocstyle]
convention = "google"


[tool.mypy]
files = ["NIGnets"]

# exclude = []

strict = true
ignore_missing_imports = true
install_types = true
non_interactive = true
plugins = ["pydantic.mypy"]

# remove after all files in the repo are fixed
follow_imports = "silent"

# from https://blog.wolt.com/engineering/2021/09/30/professional-grade-mypy-configuration/
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
show_error_codes = true

warn_unused_ignores = false

disallow_incomplete_defs = true
disallow_untyped_decorators = true
disallow_any_unimported = true

[tool.codespell]
skip = "*.js,*.map,*.pdf,*.po,*.ts,*.json,*.svg"
quiet-level = 3
ignore-words-list = ""
